name: ICMS Migration Import
description: Migrate-API driven importer that consumes an icms-import-plan.json produced by the icms-migration-workbench and creates ICMS pages, paragraphs, media and files in the target Drupal site.
package: ICMS
type: module
core_version_requirement: ^10.3 || ^11
dependencies:
  - drupal:node
  - drupal:path_alias
  - drupal:file
  - drupal:media
  - drupal:migrate
  - migrate_plus:migrate_plus
  - migrate_tools:migrate_tools
  - paragraphs:paragraphs
