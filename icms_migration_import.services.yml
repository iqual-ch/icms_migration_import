services:
  icms_migration_import.plan_reader:
    class: Drupal\icms_migration_import\Service\PlanReader

  icms_migration_import.media_importer:
    class: Drupal\icms_migration_import\Service\MediaImporter
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@file.repository'
      - '@logger.factory'

  icms_migration_import.importer:
    class: Drupal\icms_migration_import\Service\Importer
    arguments:
      - '@entity_type.manager'
      - '@language_manager'
      - '@path_alias.manager'
      - '@icms_migration_import.media_importer'
      - '@logger.factory'
