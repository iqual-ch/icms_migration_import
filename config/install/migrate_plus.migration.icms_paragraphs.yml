id: icms_paragraphs
label: 'ICMS Migration · Paragraphs'
migration_group: icms_migration
migration_tags:
  - icms

source:
  plugin: icms_plan_paragraphs

process:
  type: bundle
  langcode: langcode
  status:
    plugin: default_value
    default_value: 1

  # Unpack every entry of the plan's `fields` map onto the destination row.
  # Media references ({sourceMediaId: N}) are resolved against migrate_map_icms_media.
  _unpack_fields:
    plugin: icms_field_value
    source: fields
    media_migration: icms_media

  # Store Blökkli component options in paragraph behavior settings.
  _blokkli_options:
    plugin: icms_blokkli_options
    source: options

destination:
  plugin: 'entity_reference_revisions:paragraph'

migration_dependencies:
  required:
    - icms_files
    - icms_media
