id: icms_pages
label: 'ICMS Migration · Pages (default language)'
migration_group: icms_migration
migration_tags:
  - icms

source:
  plugin: icms_plan_pages

process:
  type: bundle
  uuid: sourceUuid
  title: title
  langcode: langcode
  status:
    plugin: default_value
    default_value: 1

  # Resolve paragraph references into the paragraph field configured by the
  # plan. This keeps imports working for every node bundle, including future
  # bundles that do not use field_icms_paragraphs.
  _paragraph_refs:
    plugin: icms_paragraph_references
    source: paragraphRefs
    field_source: paragraphField
    paragraphs_migration: icms_paragraphs

  # Optional extra node-level fields.
  _unpack_fields:
    plugin: icms_field_value
    source: fields
    media_migration: icms_media

  # Path alias is created automatically by the path destination handler
  # when present on the row.
  'path/alias': pathAlias
  'path/langcode': langcode

destination:
  plugin: 'entity:node'
  default_bundle: icms_page

migration_dependencies:
  required:
    - icms_paragraphs
    - icms_media
