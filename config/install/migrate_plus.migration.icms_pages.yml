id: icms_pages
label: 'ICMS Migration · Pages (default language)'
migration_group: icms_migration
migration_tags:
  - icms

source:
  plugin: icms_plan_pages

process:
  type: bundle
  uuid: sourceUuid
  title: title
  langcode: langcode
  status:
    plugin: default_value
    default_value: 1

  # Resolve the ordered list of paragraph references via icms_paragraphs.
  # Each sub-row is {sourceParagraphId: '<uuid>:<delta>:<idx>'}, the
  # migration_lookup returns [paragraph_id, paragraph_revision_id] which
  # the entity_reference_revisions field stores as target_id / target_revision_id.
  paragraphField:
    plugin: get
    source: paragraphField
  field_icms_paragraphs:
    plugin: sub_process
    source: paragraphRefs
    process:
      temp_ids:
        plugin: migration_lookup
        migration: icms_paragraphs
        source: sourceParagraphId
      target_id:
        plugin: extract
        source: '@temp_ids'
        index:
          - 0
      target_revision_id:
        plugin: extract
        source: '@temp_ids'
        index:
          - 1

  # Optional extra node-level fields.
  _unpack_fields:
    plugin: icms_field_value
    source: fields
    media_migration: icms_media

  # Path alias is created automatically by the path destination handler
  # when present on the row.
  'path/alias': pathAlias
  'path/langcode': langcode

destination:
  plugin: 'entity:node'
  default_bundle: icms_page

migration_dependencies:
  required:
    - icms_paragraphs
    - icms_media
